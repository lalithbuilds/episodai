[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episodai"
version = "2.1.0"
description = "Episoda Alpha MCP: Sovereign Cognitive Graph & Episodic Memory Engine with Hardware AMX & 4-Way RRF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lalith Chandra", email = "lalith070804@gmail.com" }]
keywords = [
    "episodai",
    "ai-memory",
    "mcp",
    "model-context-protocol",
    "mcp",
    "mcp-server",
    "cognitive-memory",
    "episodic-memory",
    "apple-silicon-amx",
    "sqlite-wal",
    "knowledge-graph",
    "claude-code",
    "cursor",
    "windsurf"
]
dependencies = [
    "mcp>=1.0.0",
    "pyzmq>=25.0.0",
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.1",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.19.0",
    "pysqlite3-binary>=0.5.2; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://lalithbuilds.github.io/episodai/"
Documentation = "https://lalithbuilds.github.io/episodai/"
Repository = "https://github.com/lalithbuilds/episodai"
Issues = "https://github.com/lalithbuilds/episodai/issues"
Changelog = "https://github.com/lalithbuilds/episodai/releases"

[project.optional-dependencies]
all = [
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.1",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.scripts]
episodai = "engram.cli:main"
episoda = "engram.cli:main"
episoda-mcp = "engram.server:main"
episoda-alpha-mcp = "engram.server:main"
engram = "engram.cli:main"
engram-mcp = "engram.server:main"
engram-alpha-mcp = "engram.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
