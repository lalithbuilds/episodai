name: Engram Alpha CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio
          pip install -e '.[all]'

      - name: Run complete test suite (59 tests)
        run: |
          python -m pytest -v tests/
        env:
          PYTHONPATH: src

      - name: Run LongMemEval benchmark
        run: |
          python benchmark/benchmark_longmemeval.py
        env:
          PYTHONPATH: src

      - name: Run Custom architecture benchmark
        run: |
          python benchmark/benchmark_custom.py
        env:
          PYTHONPATH: src
