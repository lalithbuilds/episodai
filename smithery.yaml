startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      dbPath:
        type: string
        description: "Optional custom absolute path to SQLite database. Defaults to ~/.engram/engram_v3.db"
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["episodai"],
      env: config?.dbPath ? { ENGRAM_DB_PATH: config.dbPath } : {}
    })
